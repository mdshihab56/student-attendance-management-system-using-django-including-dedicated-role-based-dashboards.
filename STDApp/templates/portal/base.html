{% extends "admin_panel/base.html" %}

{% block topbar %}
<div class="topbar">
    {% if kind == 'student' and request.resolver_match.url_name != 'student_dashboard' %}
        <a href="{% url 'student_dashboard' %}"> Dashboard</a>
    {% elif kind == 'teacher' and request.resolver_match.url_name != 'teacher_dashboard' %}
        <a href="{% url 'teacher_dashboard' %}"> Dashboard</a>
    {% endif %}

    
    <a href="/logout/" style="margin-left:auto;">Logout</a>
</div>
{% endblock %}
